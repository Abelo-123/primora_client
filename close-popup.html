<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Completed</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background: #0a0a0f;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .icon-box {
            width: 72px;
            height: 72px;
            background: rgba(0, 200, 83, 0.15);
            border: 2px solid #00c853;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin-bottom: 20px;
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes pop {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        h2 {
            margin: 0 0 8px 0;
            font-size: 22px;
            font-weight: 700;
        }
        p {
            color: #a0a0ab;
            font-size: 14px;
            margin: 0 0 24px 0;
            line-height: 1.4;
        }
        .btn {
            background: #007aff;
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.2s ease, transform 0.1s ease;
        }
        .btn:active {
            transform: scale(0.97);
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="icon-box">✓</div>
    <h2>Payment Completed</h2>
    <p>Closing window and returning to app...</p>
    <button id="closeBtn" class="btn" style="display: none;">Done / Return to App</button>

    <script>
        function forceCloseWindow() {
            // 1. Telegram WebApp JS SDK
            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    window.Telegram.WebApp.ready();
                    window.Telegram.WebApp.close();
                }
            } catch (e) {}

            // 2. Telegram Webview Proxy (Android / iOS native app webview)
            try {
                if (window.TelegramWebviewProxy && window.TelegramWebviewProxy.postEvent) {
                    window.TelegramWebviewProxy.postEvent('web_app_close', 'null');
                }
            } catch (e) {}

            // 3. Parent postMessage (Telegram Web client)
            try {
                if (window.parent && window.parent.postMessage) {
                    window.parent.postMessage(JSON.stringify({ eventType: 'web_app_close', eventData: '' }), '*');
                }
            } catch (e) {}

            // 4. Standard window close
            try { window.close(); } catch (e) {}
            try { self.close(); } catch (e) {}
        }

        // Run immediately when script parses
        forceCloseWindow();

        // Run repeatedly on load and DOM ready
        document.addEventListener('DOMContentLoaded', forceCloseWindow);
        window.addEventListener('load', forceCloseWindow);

        // Continuous closing attempts during transition
        const intervalId = setInterval(forceCloseWindow, 100);
        setTimeout(function() { clearInterval(intervalId); }, 2000);

        // Fallback: Only show a manual button if window remains open after 1.5s
        const closeBtn = document.getElementById('closeBtn');
        setTimeout(function() {
            if (closeBtn) {
                closeBtn.style.display = 'inline-block';
                closeBtn.onclick = function() {
                    forceCloseWindow();
                };
            }
        }, 1500);
    </script>
</body>
</html>
